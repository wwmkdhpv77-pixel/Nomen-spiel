<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomen-Abenteuer – Klasse 2</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#23334d;background:#f0f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#fff2cb,transparent 32%),linear-gradient(145deg,#e9f5ff,#f4edff);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}.panel{background:#fff;border-radius:25px;box-shadow:0 12px 32px #243b5b1c;padding:25px;margin:15px 0}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}h2{margin:8px 0 16px}p{line-height:1.5}.tag{display:inline-block;background:#e7efff;color:#3458a5;padding:8px 13px;border-radius:100px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice,.btn{border:0;border-radius:17px;padding:17px 14px;font-size:1.15rem;font-weight:800;cursor:pointer;min-height:64px;touch-action:manipulation}.choice{background:#edf4ff;color:#243b60;border:3px solid transparent}.choice:hover,.choice:focus-visible{border-color:#6889f9}.choice:disabled{cursor:default;opacity:.75}.choice.good{background:#c7f5d7;border-color:#269b59;opacity:1}.choice.bad{background:#ffe1df;border-color:#e46b62;opacity:1}.btn{background:#526de5;color:white}.btn.secondary{background:#e9edff;color:#324b9d}.btn.green{background:#13875d}.btn:disabled{opacity:.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar>*{flex:1}.hidden{display:none!important}.score{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.score>div{background:#f3f6ff;padding:12px 18px;border-radius:16px;flex:1;text-align:center;font-weight:800}.score .active{outline:3px solid #e5b93b;background:#fff6d6}.progress{height:13px;border-radius:20px;background:#e7edfb;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#6c86ef;transition:width .25s}.word{text-align:center;font-size:clamp(2rem,6vw,3.5rem);font-weight:900;margin:20px 0;color:#28468a}.instruction{font-size:1.15rem;font-weight:650;text-align:center}.feedback{text-align:center;font-weight:800;min-height:45px;font-size:1.12rem;margin:15px 0}.muted{color:#63708b}.center{text-align:center}.check{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#f6f8ff;margin:8px 0;font-weight:700}.check input{width:24px;height:24px}.small{font-size:.92rem}.errorword{color:#c3474d;text-decoration:underline;text-decoration-style:wavy}.correctword{color:#17865c}.footer{text-align:center;color:#6a7690;font-size:.85rem;padding:10px}.level{font-size:4rem;margin:8px}.input{width:100%;border:2px solid #b7c8f5;border-radius:12px;padding:13px;font-size:1.1rem}.pill{background:#fff4d3;border-radius:12px;padding:10px;font-weight:700} @media(max-width:500px){.wrap{padding:10px}.panel{padding:18px}.choice{font-size:1rem;padding:13px 8px}.score>div{padding:10px 6px}}
</style></head><body><main class="wrap"><header class="center"><div class="tag">📚 Lernspiel · 2. Klasse</div><h1>🦊 Nomen-Abenteuer</h1><p>Entdecke Wörter, Artikel und versteckte Fehler!</p></header>
<section id="start" class="panel"><h2>🎮 Wie möchtet ihr spielen?</h2><div class="grid"><button class="choice" onclick="setMode('duell')">🏆 Gegeneinander<br><span class="small">Abwechselnd Punkte sammeln</span></button><button class="choice" onclick="setMode('team')">🤝 Gemeinsam<br><span class="small">Als Team Sterne sammeln</span></button></div><div id="setup" class="hidden"><p><label for="p1">Name von Kind 1</label><input class="input" id="p1" maxlength="20" value="Kind 1"></p><p><label for="p2">Name von Kind 2</label><input class="input" id="p2" maxlength="20" value="Kind 2"></p><h3>Welche Aufgaben?</h3><label class="check"><input type="checkbox" class="topic" value="category" checked> 👥 Mensch, Tier, Pflanze oder Ding</label><label class="check"><input type="checkbox" class="topic" value="article" checked> 🔤 Der richtige Artikel</label><label class="check"><input type="checkbox" class="topic" value="error" checked> 🔎 Fehler finden</label><p><label for="length">Wie viele Aufgaben?</label> <select id="length" class="input"><option value="12">12 Aufgaben (kurz)</option><option value="18" selected>18 Aufgaben</option><option value="24">24 Aufgaben (lang)</option></select></p><button class="btn green" style="width:100%" onclick="begin()">🚀 Spiel starten</button><p id="setupmsg" role="alert"></p></div></section>
<section id="game" class="panel hidden"><div class="score"><div id="s1"></div><div id="s2"></div></div><div class="progress"><div id="bar"></div></div><div class="score"><span class="tag" id="counter"></span><span class="tag" id="topic"></span></div><p id="instruction" class="instruction"></p><div id="word" class="word"></div><div id="answers" class="grid"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="btn hidden" style="width:100%" onclick="advance()">Weiter ➜</button></section>
<section id="end" class="panel hidden center"><div class="level">🏅</div><h2 id="result"></h2><p id="resulttext"></p><div class="toolbar"><button class="btn green" onclick="restart()">🔁 Noch einmal spielen</button><button class="btn secondary" onclick="home()">⚙️ Einstellungen</button></div></section><div class="footer">Funktioniert offline · Keine Anmeldung · Keine Datenübertragung</div></main>
<script>
const data={category:[['Lehrer','Mensch'],['Ärztin','Mensch'],['Kind','Mensch'],['Bäcker','Mensch'],['Oma','Mensch'],['Pilotin','Mensch'],['Hund','Tier'],['Katze','Tier'],['Igel','Tier'],['Fuchs','Tier'],['Schmetterling','Tier'],['Pferd','Tier'],['Rose','Pflanze'],['Tulpe','Pflanze'],['Eiche','Pflanze'],['Sonnenblume','Pflanze'],['Tanne','Pflanze'],['Gras','Pflanze'],['Tisch','Ding'],['Ball','Ding'],['Buch','Ding'],['Stuhl','Ding'],['Rucksack','Ding'],['Fahrrad','Ding']],article:[['Hund','der'],['Baum','der'],['Tisch','der'],['Apfel','der'],['Vogel','der'],['Mond','der'],['Schuh','der'],['Fisch','der'],['Katze','die'],['Blume','die'],['Sonne','die'],['Schule','die'],['Maus','die'],['Tasche','die'],['Wolke','die'],['Uhr','die'],['Haus','das'],['Kind','das'],['Buch','das'],['Auto','das'],['Pferd','das'],['Fenster','das'],['Bett','das'],['Bild','das']],error:[['Der hund spielt im Garten.','hund','Hund'],['Die katze schläft auf dem Sofa.','katze','Katze'],['Ein vogel sitzt im Baum.','vogel','Vogel'],['Das kind malt ein Bild.','kind','Kind'],['Die blume wächst im Garten.','blume','Blume'],['Der junge fährt Fahrrad.','junge','Junge'],['Im Wald lebt ein fuchs.','fuchs','Fuchs'],['Das mädchen liest ein Buch.','mädchen','Mädchen'],['Die sonne scheint heute.','sonne','Sonne'],['Der ball liegt auf dem Boden.','ball','Ball'],['Wir sehen einen regenbogen.','regenbogen','Regenbogen'],['Die oma backt einen Kuchen.','oma','Oma'],['Ein schmetterling fliegt vorbei.','schmetterling','Schmetterling'],['Das auto steht vor dem Haus.','auto','Auto'],['Im Teich schwimmt ein fisch.','fisch','Fisch'],['Die lehrerin schreibt an die Tafel.','lehrerin','Lehrerin'],['Mein bruder spielt draußen.','bruder','Bruder'],['Die rose duftet wunderbar.','rose','Rose'],['Der hase hoppelt über die Wiese.','hase','Hase'],['Ich lese eine geschichte.','geschichte','Geschichte'],['Der hund schläft im korb.','hund','Hund'],['Die kinder spielen im Park.','kinder','Kinder'],['Auf dem tisch liegt ein Buch.','tisch','Tisch'],['Ein apfel fällt vom Baum.','apfel','Apfel']]};
let mode='duell',questions=[],index=0,scores=[0,0],locked=false,names=[];const $=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function setMode(m){mode=m;$('setup').classList.remove('hidden');document.querySelectorAll('#start>.grid .choice').forEach((b,i)=>{b.style.borderColor=(i===(m==='duell'?0:1))?'#526de5':'transparent'});$('setup').scrollIntoView({behavior:'smooth',block:'nearest'})}function begin(){let topics=[...document.querySelectorAll('.topic:checked')].map(x=>x.value);if(!topics.length){$('setupmsg').textContent='Bitte wählt mindestens einen Aufgabenbereich aus.';return}$('setupmsg').textContent='';names=[$('p1').value.trim()||'Kind 1',$('p2').value.trim()||'Kind 2'];let count=+$('length').value;let pool=[];for(let t of topics){pool.push(...shuffle(data[t]).map(item=>({type:t,item})).slice(0,Math.ceil(count/topics.length)+2))}questions=shuffle(pool).slice(0,count);index=0;scores=[0,0];$('start').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){locked=false;let q=questions[index],turn=index%2;$('s1').textContent=mode==='duell'?`${names[0]}: ${scores[0]} ⭐`:`🤝 ${names[0]} & ${names[1]}`;$('s2').textContent=mode==='duell'?`${names[1]}: ${scores[1]} ⭐`:`Team: ${scores[0]} ⭐`;$('s1').classList.toggle('active',mode==='duell'&&turn===0);$('s2').classList.toggle('active',mode==='duell'&&turn===1);$('bar').style.width=(index/questions.length*100)+'%';$('counter').textContent=`Aufgabe ${index+1} von ${questions.length}`;$('topic').textContent={category:'🧩 Kategorien',article:'🔤 Artikel',error:'🔎 Fehler finden'}[q.type];$('feedback').textContent='';$('next').classList.add('hidden');$('answers').replaceChildren();if(q.type==='category'){$('instruction').textContent=`${mode==='duell'?names[turn]+', du bist dran! ':' '}Zu welcher Gruppe gehört dieses Nomen?`;$('word').textContent=q.item[0];makeOptions(['Mensch','Tier','Pflanze','Ding'],q.item[1])}else if(q.type==='article'){$('instruction').textContent=`${mode==='duell'?names[turn]+', du bist dran! ':' '}Welcher Artikel passt zum Nomen?`;$('word').textContent=q.item[0];makeOptions(['der','die','das'],q.item[1])}else{$('instruction').textContent=`${mode==='duell'?names[turn]+', du bist dran! ':' '}Welches Wort muss großgeschrieben werden? Tippe auf das falsche Wort!`;$('word').textContent='🔍';$('word').style.fontSize='2.4rem';let words=q.item[0].split(' ');$('answers').style.gridTemplateColumns='repeat(3,minmax(0,1fr))';words.forEach(w=>{let b=document.createElement('button');b.className='choice';b.textContent=w;b.onclick=()=>answer(b,w.replace(/[.,!?]/g,'' )===q.item[1],q.item[2]);$('answers').append(b)})}if(q.type!=='error'){$('word').style.fontSize='';$('answers').style.gridTemplateColumns=''}}
function makeOptions(opts,correct){shuffle(opts).forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(b,v===correct,correct);$('answers').append(b)})}function answer(button,ok,correct){if(locked)return;locked=true;let turn=index%2;if(ok){scores[mode==='duell'?turn:0]++;button.classList.add('good');$('feedback').textContent='🎉 Richtig! Super gemacht!'}else{button.classList.add('bad');$('feedback').textContent='💡 Fast! Richtig ist: '+correct;for(let b of $('answers').children){if(b.textContent.replace(/[.,!?]/g,'')===correct)b.classList.add('good')}}[...$('answers').children].forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'Ergebnis ansehen 🏅':'Nächste Aufgabe ➜';$('s1').textContent=mode==='duell'?`${names[0]}: ${scores[0]} ⭐`:`🤝 ${names[0]} & ${names[1]}`;$('s2').textContent=mode==='duell'?`${names[1]}: ${scores[1]} ⭐`:`Team: ${scores[0]} ⭐`}
function advance(){index++;if(index>=questions.length){finish()}else render()}function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');if(mode==='duell'){let winner=scores[0]===scores[1]?'Unentschieden! 🤝':`${names[scores[0]>scores[1]?0:1]} gewinnt! 🏆`;$('result').textContent=winner;$('resulttext').textContent=`${names[0]}: ${scores[0]} Sterne · ${names[1]}: ${scores[1]} Sterne. Ihr habt toll geübt!`}else{$('result').textContent=scores[0]>=questions.length*.8?'Tolles Team! 🌟':'Gemeinsam geschafft! 🎉';$('resulttext').textContent=`Ihr habt ${scores[0]} von ${questions.length} Sternen gesammelt. Weiter so!`}$('end').scrollIntoView({behavior:'smooth'})}function restart(){begin()}function home(){$('end').classList.add('hidden');$('game').classList.add('hidden');$('start').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
